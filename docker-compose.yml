# Run the whole system locally with one command:  docker compose up --build
# then open http://localhost:8000. Reads secrets from .env (see .env.example).
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fitcheck}
      MYSQL_USER: ${DB_USER:-fitcheck_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 30
  web:
    build: .
    depends_on:
      db: {condition: service_healthy}
    env_file: .env
    environment:
      DB_HOST: db
      # plain http on localhost; put HTTPS in front before going public
      COOKIE_SECURE: "0"
    ports: ["127.0.0.1:8000:8000"]
volumes:
  mysql-data:
