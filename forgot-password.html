<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Yd9uvy1ZPoMFnWWgteNR5ykAr+pHgg3PamAY5jrfGnU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.open-meteo.com; worker-src 'self' blob:; frame-src 'none'; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password, FitCheck.AI</title>
  <meta name="author" content="Swayam Shakya">
  <meta name="theme-color" content="#fff5e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#150a2c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/images/favicon.png" sizes="64x64" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
  <script>
    (function () {
      // FitCheck.AI is never meant to be framed: hide it if another site does (clickjacking)
      if (window.top !== window.self) document.documentElement.style.display = "none";
      try {
        var t = localStorage.getItem("fitcheck.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="assets/fonts/bungee.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/rubik-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script type="module" src="assets/js/pages/forgot.js"></script>
</head>
<body class="auth">
  <a class="skip-link" href="#main">Skip to content</a>
  <button class="icon-btn theme-toggle auth__theme" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode"><span class="swatch" aria-hidden="true"></span></button>
  <main id="main" class="auth__main">
    <a class="wordmark auth__mark" href="index.html" aria-label="FitCheck.AI home"><img class="auth__logo" src="assets/images/logo/fitcheck-mark.png" alt="" width="97" height="97"><span class="auth__name">FitCheck<span class="wordmark__ai">.ai</span></span></a>
    <form class="swing-tag auth__tag" data-auth-form novalidate>
      <h1 class="auth__title">Forgot your password?</h1>
      <p class="muted">Enter the email you signed up with and we'll send a link to choose a new one.</p>
      <div data-auth-notice></div>
      <div class="field">
        <label class="field__label" for="f-email">Email</label>
        <input class="input" id="f-email" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="btn btn--primary btn--lg" type="submit">Send reset link</button>
      <p class="auth__switch">Remembered it? <a href="login.html">Sign in</a></p>
    </form>
    <p class="auth__links"><a href="privacy.html">Privacy and cookies</a> <a href="terms.html">Terms</a></p>
    <p class="auth__credit">FitCheck.AI, designed and built by <strong>Swayam Shakya</strong>. <span class="api-status" data-api-status data-state="checking">Starting up…</span></p>
  </main>
</body>
</html>
