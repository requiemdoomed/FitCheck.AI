<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-Yd9uvy1ZPoMFnWWgteNR5ykAr+pHgg3PamAY5jrfGnU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.open-meteo.com; worker-src 'self' blob:; frame-src 'none'; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outfit history, FitCheck.AI</title>
  <meta name="author" content="Swayam Shakya">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff5e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#150a2c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/images/favicon.png" sizes="64x64" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
  <script>
    (function () {
      // FitCheck.AI is never meant to be framed: hide it if another site does (clickjacking)
      if (window.top !== window.self) document.documentElement.style.display = "none";
      try {
        var t = localStorage.getItem("fitcheck.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="assets/fonts/bungee.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/rubik-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script type="module" src="assets/js/pages/history.js"></script>
</head>
<body class="app">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-shell-header class="site-header"></header>

  <main id="main" class="container app-main">

    <div class="page-head">
      <div>
        <h1>Outfit history</h1>
        <p>Every outfit FitCheck.AI has suggested, newest first. Rating them teaches it your taste.</p>
      </div>
      <div class="cat-tabs" role="group" aria-label="Show" data-history-filter>
        <button class="cat-tab" type="button" data-verdict="" aria-pressed="true">All</button>
        <button class="cat-tab" type="button" data-verdict="like" aria-pressed="false">Liked</button>
        <button class="cat-tab" type="button" data-verdict="dislike" aria-pressed="false">Not for me</button>
      </div>
    </div>
    <div data-history><div class="loading-block"><span class="stitch-loader" role="status"><svg viewBox="0 0 64 10" aria-hidden="true"><line x1="2" y1="5" x2="62" y2="5"/></svg><span>Loading your history…</span></span></div></div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>FitCheck.AI, designed and built by <strong>Swayam Shakya</strong>.</p>
      <span class="api-status" data-api-status data-state="checking">Starting up…</span>
      <nav aria-label="Footer" class="footer-links"><a href="privacy.html">Privacy and cookies</a> <a href="terms.html">Terms</a></nav>
    </div>
  </footer>
  <nav data-shell-tabbar></nav>
</body>
</html>
