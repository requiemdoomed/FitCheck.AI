<!doctype html>

<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-UHDKyYtlK/tVLZ5EXAs0scqR97ePPebwaM0C+sLk1dA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.open-meteo.com; worker-src 'self' blob:; frame-src 'none'; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">

  <title>Page not found, FitCheck.AI</title>
  <meta name="author" content="Swayam Shakya">
  <!--
    The server answers any unknown address with this page, which might be
    several folders deep. Relative links would break there, so work out the
    site root first.
  -->
  <script>
    (function () {
      var root = "/";
      if (/\.github\.io$/.test(location.hostname)) {
        var first = location.pathname.split("/")[1];
        if (first && first.indexOf(".") === -1) root = "/" + first + "/";
      }
      document.write('<base href="' + root + '">');
      // FitCheck.AI is never meant to be framed: hide it if another site does (clickjacking)
      if (window.top !== window.self) document.documentElement.style.display = "none";
      try {
        var t = localStorage.getItem("fitcheck.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/images/favicon.png" sizes="64x64" type="image/png">

    .lost h1 { font-size: var(--t-2xl); }
    .lost p { color: var(--ink-soft); font-size: var(--t-md); }
  </style>
</head>
<body>
  <main class="container lost">
