name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fitcheck_test
          MYSQL_USER: fitcheck_app
          MYSQL_PASSWORD: LocalDevPass_2026
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest tests/ml tests/engine tests/static tests/backend -q
      - run: python -m pytest tests/frontend -q
